name: Release

on:
  push:
    branches:
      - main
      - track/**

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yaml
    secrets: inherit
    permissions:
      contents: write

  release:
    name: Release charm to Charmhub
    needs:
      - ci
    uses: canonical/data-platform-workflows/.github/workflows/release_charm_edge.yaml@v38.0.0
    with:
      artifact-prefix: ${{ needs.ci.outputs.artifact-prefix }}
      track: latest
    secrets:
      charmhub-token: ${{ secrets.CHARMCRAFT_CREDENTIALS }}
